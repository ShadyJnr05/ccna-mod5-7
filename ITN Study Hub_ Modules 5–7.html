<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITN Study Hub: Modules 5–7</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#14202e;--mu:#5b6b7d;--ac:#0b7bc1;--bd:#d6dde6;--ok:#178a4c;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1a2b;--card:#13273d;--tx:#e6eef7;--mu:#9bb0c6;--ac:#4cc3ff;--bd:#25405c;--ok:#3ddc84;--no:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0b1a2b;--card:#13273d;--tx:#e6eef7;--mu:#9bb0c6;--ac:#4cc3ff;--bd:#25405c;--ok:#3ddc84;--no:#ff7b6b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.4rem;margin:.2em 0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#04121f;border-color:var(--ac);font-weight:600}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}nav button.on{background:var(--ac);color:#04121f;font-weight:600}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
details summary{cursor:pointer;font-weight:600;color:var(--ac)}ul{margin:.4em 0;padding-left:1.2em}
code{background:var(--bg);padding:1px 6px;border-radius:5px;border:1px solid var(--bd)}
.fc{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.15rem;cursor:pointer;user-select:none}
.opt{display:block;width:100%;text-align:left;margin:6px 0}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
input,select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.mu{color:var(--mu);font-size:.9rem}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer{text-align:center;color:var(--mu);padding:24px 0 8px;font-size:.9rem}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--bd);padding:6px 10px;text-align:left}
</style></head><body><div class="w">
<header><h1>ITN Study Hub · Modules 5–7</h1><button id="th">🌓 Theme</button></header>
<div class="mu">Number Systems · Data Link Layer · Ethernet Switching</div>
<div class="bar" style="margin-top:10px"><i id="pb"></i></div><div class="mu" id="pt"></div>
<nav id="nav"></nav><main id="m"></main>
<footer>Modau.M IT</footer></div>
<script>
const N=[
{id:"m5",t:"Module 5: Number Systems",s:[
["Binary & IPv4",["Binary = base 2 (1s and 0s, called bits); decimal = base 10 (0–9).","IPv4 address = 32 bits in 4 octets (8 bits / 1 byte each), written in dotted decimal.","Positional values for an octet: 128 64 32 16 8 4 2 1."]],
["Binary ↔ Decimal",["Binary → decimal: add the positional values where the bit is 1 (11000000 = 128+64 = 192).","Decimal → binary: from 128 down, if n ≥ position write 1 and subtract, else write 0. Example: 168 = 10101000."]],
["Hexadecimal",["Base 16: digits 0–9 and letters A–F (A=10 … F=15). One hex digit = 4 bits.","Used for IPv6 and MAC addresses. IPv6 = 128 bits = 32 hex digits, in 8 hextets of 4 hex digits.","Decimal → hex: convert to 8-bit binary, split in groups of 4, convert each (168 = 1010 1000 = A8).","Hex → decimal: convert each digit to 4 bits, join, convert to decimal (D2 = 1101 0010 = 210)."]],
["Terms",["dotted decimal, positional notation, radix, base 10, base 16, octet, hextet."]]]},
{id:"m6",t:"Module 6: Data Link Layer",s:[
["Purpose",["Layer 2: communication between end-device NICs; encapsulates Layer 3 packets (IPv4/IPv6) into frames; detects errors and rejects corrupt frames.","IEEE 802 splits it into LLC (talks to upper-layer software, 802.2) and MAC (data encapsulation + media access control).","At each hop a router: accepts a frame, de-encapsulates it, re-encapsulates the packet into a new frame, forwards it on the next medium.","Standards bodies: IEEE, ITU, ISO, ANSI."]],
["Topologies",["Physical = how devices are physically connected; logical = virtual connections via interfaces and IP addressing.","WAN: point-to-point, hub and spoke, mesh.","LAN: star and extended star (typical); legacy bus and ring."]],
["Duplex & access control",["Half-duplex: one direction at a time (WLANs, legacy hubs). Full-duplex: both at once (switches).","Contention-based (half-duplex): CSMA/CD on legacy Ethernet (detect collision, wait random time, resend); CSMA/CA on 802.11 WLANs (announces transmission duration).","Controlled access: deterministic, each node gets a turn (Token Ring, ARCNET)."]],
["Frame",["Three parts: header, data, trailer.","Fields: frame start/stop, addressing, type, control, data, error detection.","Layer 2 addresses = physical addresses, used only for local delivery on the link, rewritten by each forwarding device.","Protocols: Ethernet, 802.11, PPP, HDLC, Frame Relay."]]]},
{id:"m7",t:"Module 7: Ethernet Switching",s:[
["Ethernet frame",["Ethernet works at Layers 1–2 (IEEE 802.2 LLC + 802.3 MAC).","Fields: preamble/SFD (8 B), dest MAC (6), source MAC (6), type/length (2), data (45–1500), FCS (4).","Frame size 64–1518 bytes (preamble excluded). Under 64 = runt/collision fragment, discarded. Over max = dropped (jumbo/baby giant)."]],
["MAC addresses",["48 bits = 12 hex digits = 6 bytes. First 3 bytes = OUI (vendor, from IEEE); last 3 = vendor assigned.","Unicast: one source to one destination (source MAC is always unicast). ARP finds MAC for IPv4; ND for IPv6.","Broadcast: FF-FF-FF-FF-FF-FF, flooded out all ports except incoming, not forwarded by routers.","Multicast: 01-00-5E (IPv4) or 33-33 (IPv6); only valid as destination."]],
["MAC address table",["Switch decides using Layer 2 MAC addresses only. Table (CAM table) starts empty.","Learn: read the source MAC + incoming port; add it or refresh timer (default 5 min). Same MAC on a new port replaces the entry.","Forward: known unicast goes out one port; unknown unicast, broadcast and multicast are flooded out all ports except the incoming one."]],
["Forwarding & port settings",["Store-and-forward: receive whole frame, check CRC, then forward; needed for QoS.","Cut-through: fast-forward (forwards after reading destination, lowest latency, no error check) and fragment-free (checks first 64 bytes).","Buffering: port-based (queues per port, head-of-line delay) vs shared memory (common pool, dynamic).","Duplex mismatch (one half, one full) causes collisions and poor performance on 10/100 links; best practice: full-duplex both sides. Gigabit is full-duplex only.","Auto-MDIX detects cable type; re-enable with mdix auto."]]]}];
const F=[["IPv4 address size?","32 bits, 4 octets"],["Positional values of an octet","128 64 32 16 8 4 2 1"],["168 in binary","10101000"],["168 in hex","A8"],["D2 in decimal","210"],["IPv6 address length?","128 bits = 32 hex digits, 8 hextets"],["What is a hextet?","A group of 4 hex digits (16 bits)"],["LLC sublayer role","Talks to upper-layer software; identifies the network-layer protocol (802.2)"],["MAC sublayer role","Data encapsulation and media access control"],["CSMA/CD vs CSMA/CA","CD: legacy Ethernet, detects collisions. CA: WLANs, avoids by announcing duration"],["Three parts of a data link frame","Header, data, trailer"],["Are Layer 2 addresses end-to-end?","No, link-local only; rewritten at each hop"],["Ethernet min/max frame size","64 and 1518 bytes"],["Runt frame","Frame under 64 bytes, discarded"],["OUI","First 3 bytes of a MAC, assigned to vendor by IEEE"],["Broadcast MAC","FF-FF-FF-FF-FF-FF"],["IPv4 / IPv6 multicast MAC prefix","01-00-5E / 33-33"],["Switch learning","Reads SOURCE MAC and incoming port; entry ages out after 5 min by default"],["Unknown unicast","Destination not in table: flooded out all ports except incoming"],["Store-and-forward","Whole frame received, CRC checked, then forwarded; required for QoS"],["Fragment-free","Cut-through that checks first 64 bytes before forwarding"],["Duplex mismatch","One side half, other full: collisions and poor performance"],["Auto-MDIX","Auto-detects cable type; re-enable with mdix auto"]];
const Q=[["How many bits in an IPv4 octet?",["4","8","16","32"],1,"An octet is 8 bits (1 byte)."],["Decimal 192 in binary?",["11000000","10101000","11100000","10000001"],0,"128+64 = 192."],["Hex value of binary 1010?",["8","A","C","F"],1,"1010 = 10 = A."],["How many hex digits in an IPv6 address?",["8","16","32","128"],2,"128 bits ÷ 4 = 32."],["Which sublayer handles media access control?",["LLC","MAC","Physical","Network"],1,"MAC handles encapsulation and media access."],["Which method does a WLAN use?",["CSMA/CD","CSMA/CA","Token passing","Polling"],1,"802.11 uses collision avoidance."],["What do switches use for full-duplex?",["Collision detection","No CSMA/CD needed","Hubs","Token"],1,"Full-duplex needs no CSMA/CD."],["Which is NOT a common WAN topology?",["Point-to-point","Hub and spoke","Mesh","Bus"],3,"Bus is a legacy LAN topology."],["Min Ethernet frame size?",["32","64","128","1518"],1,"Under 64 bytes is a runt."],["Size of an Ethernet MAC address?",["32 bits","48 bits","64 bits","128 bits"],1,"48 bits = 6 bytes."],["Destination MAC FF-FF-FF-FF-FF-FF is a…",["Unicast","Multicast","Broadcast","Loopback"],2,"All ones = broadcast."],["What does a switch read to LEARN a MAC?",["Destination MAC","Source MAC","IP address","Type field"],1,"Source MAC + incoming port."],["Switch gets a frame for an unknown unicast MAC. It…",["Drops it","Floods all ports except incoming","Sends to router","Floods all ports"],1,"Flooded except the port it arrived on."],["Default MAC table aging time?",["30 sec","1 min","5 min","60 min"],2,"Five minutes by default."],["Which forwarding method does NO error checking and is fastest?",["Store-and-forward","Fragment-free","Fast-forward","Shared memory"],2,"Fast-forward forwards right after the destination address."],["A duplex mismatch is…",["Both ports full","One half, one full","Both half","Speed 10 vs 10"],1,"It causes collisions and poor performance."],["Which is a data link frame header/trailer item?",["Source IP","Error detection","TCP port","DNS name"],1,"Trailer carries error detection (FCS)."]];
const $=s=>document.querySelector(s);let S={};
try{S=JSON.parse(localStorage.getItem("itn")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("itn",JSON.stringify(S))}catch(e){}};
S.done=S.done||{};S.known=S.known||{};S.best=S.best||0;
try{const t=localStorage.getItem("itnth");if(t)document.documentElement.dataset.theme=t}catch(e){}
$("#th").onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;d.dataset.theme=dk?"light":"dark";try{localStorage.setItem("itnth",d.dataset.theme)}catch(e){}};
const tabs=[["notes","Notes"],["cards","Flashcards"],["quiz","Quiz"],["tool","Converter"]];let tab="notes";
function prog(){const a=N.length+F.length;const n=Object.keys(S.done).filter(k=>S.done[k]).length+Object.keys(S.known).filter(k=>S.known[k]).length;$("#pb").style.width=(100*n/a)+"%";$("#pt").textContent=n+" / "+a+" items mastered · best quiz: "+S.best+"/"+Q.length}
function nav(){$("#nav").innerHTML="";tabs.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;if(k===tab)b.className="on";b.onclick=()=>{tab=k;nav();R()};$("#nav").appendChild(b)})}
function R(){prog();({notes,cards,quiz,tool})[tab]()}
function notes(){const m=$("#m");m.innerHTML="";N.forEach(x=>{const c=document.createElement("div");c.className="c";c.innerHTML="<h2 style='margin:0 0 6px;font-size:1.15rem'>"+x.t+"</h2>"+x.s.map(s=>"<details><summary>"+s[0]+"</summary><ul>"+s[1].map(b=>"<li>"+b+"</li>").join("")+"</ul></details>").join("")+"<label class='mu' style='display:block;margin-top:10px'><input type='checkbox' style='width:auto' "+(S.done[x.id]?"checked":"")+"> Mark module as studied</label>";c.querySelector("input").onchange=e=>{S.done[x.id]=e.target.checked;sv();prog()};m.appendChild(c)})}
let ci=0,fl=false;
function cards(){const m=$("#m"),k=F[ci];m.innerHTML="<div class='mu'>Card "+(ci+1)+" of "+F.length+" · tap card to flip</div><div class='c fc' id='fc'>"+(fl?k[1]:k[0])+"</div><div class='row'><button id='pv'>← Prev</button><button id='kn' class='p'>"+(S.known[ci]?"✓ Known":"Mark known")+"</button><button id='nx'>Next →</button><button id='sh'>Shuffle</button></div>";$("#fc").onclick=()=>{fl=!fl;cards()};$("#pv").onclick=()=>{ci=(ci+F.length-1)%F.length;fl=false;cards()};$("#nx").onclick=()=>{ci=(ci+1)%F.length;fl=false;cards()};$("#kn").onclick=()=>{S.known[ci]=!S.known[ci];sv();cards();prog()};$("#sh").onclick=()=>{ci=Math.floor(Math.random()*F.length);fl=false;cards()}}
let qi=0,sc=0,ans=false;
function quiz(){const m=$("#m");if(qi>=Q.length){if(sc>S.best){S.best=sc;sv()}prog();m.innerHTML="<div class='c'><h2>Done: "+sc+" / "+Q.length+"</h2><p class='mu'>Best: "+S.best+"</p><button class='p' id='rs'>Try again</button></div>";$("#rs").onclick=()=>{qi=0;sc=0;quiz()};return}
const q=Q[qi];ans=false;m.innerHTML="<div class='c'><div class='mu'>Question "+(qi+1)+" / "+Q.length+" · score "+sc+"</div><h3>"+q[0]+"</h3><div id='o'></div><p id='ex' class='mu'></p><button id='nq' class='p' style='display:none'>Next →</button></div>";q[1].forEach((t,i)=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>{if(ans)return;ans=true;if(i===q[2]){sc++;b.classList.add("ok")}else{b.classList.add("no");$("#o").children[q[2]].classList.add("ok")}$("#ex").textContent=q[3];$("#nq").style.display="";};$("#o").appendChild(b)});$("#nq").onclick=()=>{qi++;quiz()}}
function tool(){const m=$("#m");m.innerHTML="<div class='c'><h3 style='margin-top:0'>Decimal → binary / hex</h3><input id='d' type='number' min='0' max='255' placeholder='0–255 (e.g. 168)'><p id='r1'></p></div><div class='c'><h3 style='margin-top:0'>Binary → decimal / hex</h3><input id='b' placeholder='8 bits (e.g. 11000000)' maxlength='8'><p id='r2'></p></div><div class='c'><h3 style='margin-top:0'>Hex → decimal / binary</h3><input id='h' placeholder='00–FF (e.g. D2)' maxlength='2'><p id='r3'></p></div>";
const f=(n)=>"Decimal <code>"+n+"</code> · Binary <code>"+n.toString(2).padStart(8,"0")+"</code> · Hex <code>"+n.toString(16).toUpperCase().padStart(2,"0")+"</code>";
$("#d").oninput=e=>{const n=parseInt(e.target.value,10);$("#r1").innerHTML=n>=0&&n<=255?f(n):"Enter 0–255"};
$("#b").oninput=e=>{const v=e.target.value;$("#r2").innerHTML=/^[01]{1,8}$/.test(v)?f(parseInt(v,2)):"Enter up to 8 bits of 0/1"};
$("#h").oninput=e=>{const v=e.target.value;$("#r3").innerHTML=/^[0-9a-fA-F]{1,2}$/.test(v)?f(parseInt(v,16)):"Enter 1–2 hex digits"}}
nav();R();
</script></body></html>
